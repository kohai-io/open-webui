name: open-webui

services:
  open-webui:
    image: ${SERVICE_IMAGE:?SERVICE_IMAGE must be an immutable digest reference}
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - ./runtime.env
    ports:
      - "8080:8080"
    volumes:
      - /srv/open-webui/data:/app/backend/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail http://127.0.0.1:8080/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
